<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AGOE — IDOL INTERFACE SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --base: #0A0606;
    --base-2: #100808;
    --oxblood: #801515;
    --oxblood-bright: #B71D1D;
    --oxblood-muted: #4a0d0d;
    --aubergine: #5F003E;
    --burnt: #7B3300;
    --hairline: rgba(255, 230, 230, 0.14);
    --hairline-strong: rgba(255, 230, 230, 0.22);
    --ink: #E8D8D8;
    --ink-dim: #8a6e6e;
    --ink-ghost: #4e3a3a;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ background: var(--base); color: var(--ink); }
  body{
    font-family: 'Space Grotesk', -apple-system, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01","ss02";
  }
  .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .caps{ text-transform: uppercase; letter-spacing: .14em; }

  /* ---------- Global texture layers ---------- */
  .grain{
    position: fixed; inset: 0; pointer-events: none; z-index: 40;
    opacity: .35; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0.6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .scanlines{
    position: fixed; inset: 0; pointer-events: none; z-index: 39;
    background: repeating-linear-gradient(to bottom,
      transparent 0, transparent 2px,
      rgba(255, 30, 30, 0.035) 2px, rgba(255, 30, 30, 0.035) 3px);
    mix-blend-mode: screen;
  }
  .vignette{
    position: fixed; inset: 0; pointer-events: none; z-index: 38;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%),
      radial-gradient(ellipse at 20% 10%, rgba(128, 21, 21, 0.08) 0%, transparent 45%);
  }

  /* ---------- Eye motif layer ---------- */
  .eye-layer{
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .eye-layer svg{
    width: min(140vw, 2200px);
    opacity: .22;
    filter: contrast(1.1);
  }

  /* ---------- HUD shell ---------- */
  #root{ position: relative; z-index: 2; min-height: 100vh; }
  .hud{
    position: relative;
    min-height: 100vh;
    padding: 22px 28px 28px;
  }
  .frame-corner{
    position: absolute; width: 22px; height: 22px;
    border: 1px solid var(--oxblood);
  }
  .fc-tl{ top: 14px; left: 18px; border-right:none; border-bottom:none; }
  .fc-tr{ top: 14px; right: 18px; border-left:none; border-bottom:none; }
  .fc-bl{ bottom: 14px; left: 18px; border-right:none; border-top:none; }
  .fc-br{ bottom: 14px; right: 18px; border-left:none; border-top:none; }

  .topbar{
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    font-size: 10px;
    color: var(--ink-dim);
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .topbar .left{ display:flex; gap:18px; align-items:center; }
  .topbar .center{ display:flex; gap:10px; align-items:center; color: var(--oxblood); }
  .topbar .right{ display:flex; gap:18px; align-items:center; justify-content:flex-end; }
  .sys-id{
    border: 1px solid var(--hairline-strong);
    padding: 5px 10px 4px;
    display:inline-flex; gap:10px; align-items:center;
  }
  .dot{
    width:6px; height:6px; background: var(--oxblood-bright); border-radius: 50%;
    box-shadow: 0 0 6px var(--oxblood-bright);
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  .live{ color: var(--oxblood-bright); letter-spacing: .2em; font-weight:500;}

  .rail{
    position: absolute; top: 80px; bottom: 60px;
    width: 14px;
    display:flex; flex-direction:column; justify-content:space-between;
    color: var(--ink-ghost);
    font-size: 8px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    letter-spacing: .2em;
  }
  .rail.left{ left: 8px; }
  .rail.right{ right: 8px; transform: rotate(0deg); writing-mode: vertical-rl; }
  .rail span{ padding: 2px 0; }

  /* ---------- Nav ---------- */
  .nav-float{ position: absolute; z-index: 5; }
  .nav-item{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--oxblood);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 2px 10px;
    position: relative;
    transition: color .15s ease, text-shadow .15s ease;
    display:inline-flex; align-items:center; gap: 10px;
  }
  .nav-item .plus{
    display:inline-block; width:14px; height:14px; position:relative;
    border: 1px solid currentColor;
  }
  .nav-item .plus::before, .nav-item .plus::after{
    content:""; position:absolute; background: currentColor;
  }
  .nav-item .plus::before{ left:50%; top:3px; bottom:3px; width:1px; transform:translateX(-50%); }
  .nav-item .plus::after{ top:50%; left:3px; right:3px; height:1px; transform:translateY(-50%); }
  .nav-item::after{
    content:""; position:absolute; left:0; right: 32px; bottom: 4px;
    height:1px; background: currentColor; opacity: .25;
  }
  .nav-item:hover{
    color: var(--oxblood-bright);
    text-shadow: 0 0 14px rgba(183, 29, 29, .7), 0 0 2px rgba(183, 29, 29, .9);
  }
  .nav-item:hover::after{ opacity: .7; }
  .nav-item.active{
    color: #ff3030;
    text-shadow: 0 0 10px rgba(255, 48, 48, .6);
  }
  .nav-item.active::after{ opacity: 1; background: #ff3030; height: 2px; }

  /* ---------- Wordmark ---------- */
  .wordmark{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(140px, 19vw, 320px);
    line-height: .82;
    color: var(--oxblood);
    letter-spacing: -.04em;
    text-shadow: 0 0 40px rgba(128, 21, 21, .4);
    font-feature-settings: "ss01";
  }
  .wordmark .i{ color: var(--oxblood-bright); }

  /* ---------- Captions / telemetry ---------- */
  .caption{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .18em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .caption .num{ color: var(--oxblood); margin-right: 6px; }
  .telemetry{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; line-height: 1.6;
    color: var(--ink-dim);
  }
  .telemetry .k{ color: var(--oxblood); }

  .hairline{ height:1px; background: var(--hairline); }
  .hair-v{ width:1px; background: var(--hairline); }

  /* ---------- Hero grid ---------- */
  .hero{
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 0;
    margin-top: 20px;
    min-height: calc(100vh - 140px);
  }
  .hero-left{
    position: relative;
    padding: 40px 40px 40px 20px;
    display:flex; flex-direction:column; justify-content:space-between;
    min-height: 640px;
  }
  .hero-right{
    position: relative;
    padding: 40px 20px 40px 40px;
    border-left: 1px solid var(--hairline);
    display:flex; flex-direction:column; justify-content:space-between;
    min-height: 640px;
  }

  .tagline{
    font-size: 14px;
    letter-spacing: .3em;
    color: var(--ink);
    text-transform: uppercase;
    margin-top: 24px;
  }
  .sub-tags{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .18em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-top: 14px;
    line-height: 1.8;
  }
  .sub-tags .sep{ color: var(--oxblood); margin: 0 8px; }

  /* ---------- HUD viewport ---------- */
  .viewport{
    position: relative;
    border: 1px solid var(--oxblood);
    padding: 14px 16px;
    margin-top: 18px;
    background: linear-gradient(180deg, rgba(128,21,21,0.06), rgba(0,0,0,0));
  }
  .viewport::before, .viewport::after{
    content:""; position:absolute; width: 10px; height: 10px;
    border: 1px solid var(--oxblood);
  }
  .viewport::before{ top:-5px; left:-5px; border-right:none; border-bottom:none; }
  .viewport::after{ bottom:-5px; right:-5px; border-left:none; border-top:none; }
  .viewport .cnr{
    position:absolute; width:10px; height:10px; border:1px solid var(--oxblood);
  }
  .viewport .cnr.tr{ top:-5px; right:-5px; border-left:none; border-bottom:none; }
  .viewport .cnr.bl{ bottom:-5px; left:-5px; border-right:none; border-top:none; }
  .viewport h3{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--oxblood);
    letter-spacing: .2em; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .viewport .line{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--ink);
    letter-spacing: .1em;
    padding: 2px 0;
  }
  .viewport .line::before{ content:"// "; color: var(--oxblood); }
  .viewport .bar{
    margin-top: 10px;
    display:flex; gap:4px;
  }
  .viewport .bar i{
    flex:1; height: 4px; background: var(--oxblood-muted);
  }
  .viewport .bar i.on{ background: var(--oxblood-bright); box-shadow: 0 0 6px var(--oxblood-bright); }

  /* ---------- Wireframe orbits ---------- */
  .wire-stage{
    position: relative;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    min-height: 420px;
  }
  .wire-stage svg{ width: 100%; max-width: 520px; height: auto; }
  .wire-stage .rot{ transform-origin: center; animation: rot 60s linear infinite; }
  .wire-stage .rot-slow{ transform-origin: center; animation: rot 140s linear infinite reverse; }
  @keyframes rot{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .sigil{
    position: absolute;
    width: 86px; height: 86px;
    opacity: .9;
  }
  .sigil svg{ width: 100%; height: 100%; }
  .sigil.bl{ bottom: 60px; left: 40px; }

  /* ---------- Marquee / ticker ---------- */
  .ticker{
    position: relative;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 10px 0;
    overflow: hidden;
    margin-top: 20px;
  }
  .ticker-track{
    display: flex; gap: 48px;
    white-space: nowrap;
    animation: tick 40s linear infinite;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .ticker-track span b{ color: var(--oxblood-bright); font-weight: 500; }
  .ticker-track span .mark{ color: var(--oxblood); margin: 0 12px; }
  @keyframes tick{ from{transform:translateX(0)} to{transform:translateX(-50%)} }

  /* ---------- Subviews ---------- */
  .subview{
    position: relative;
    padding: 30px 60px 60px 60px;
    min-height: calc(100vh - 140px);
  }
  .subview h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(48px, 7vw, 120px);
    line-height: .9;
    letter-spacing: -.02em;
    color: var(--oxblood);
    margin-top: 10px;
  }
  .subview .eyebrow{
    display:flex; gap:14px; align-items:center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .22em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .subview .eyebrow b{ color: var(--oxblood); font-weight: 500; }
  .subview .eyebrow .sep{ width: 40px; height:1px; background: var(--hairline-strong); }

  /* socials grid */
  .socials-grid{
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 0;
    border-top: 1px solid var(--hairline);
  }
  .social-card{
    grid-column: span 4;
    border-right: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 28px 24px 32px;
    position: relative;
    cursor: pointer;
    transition: background .2s;
  }
  .social-card:hover{ background: rgba(128, 21, 21, .08); }
  .social-card:hover .sc-cta{ color: var(--oxblood-bright); text-shadow: 0 0 10px rgba(183,29,29,.6); }
  .social-card .sc-num{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--oxblood); letter-spacing:.2em;
  }
  .social-card .sc-name{
    font-size: 28px; font-weight: 500; letter-spacing: .04em;
    margin-top: 20px; text-transform: uppercase;
    color: var(--ink);
  }
  .social-card .sc-handle{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--ink-dim); letter-spacing: .12em;
    margin-top: 6px;
  }
  .social-card .sc-stats{
    margin-top: 30px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-dim); letter-spacing: .16em;
    text-transform: uppercase;
  }
  .social-card .sc-stats b{ color: var(--ink); display:block; font-size: 18px; font-weight: 400; letter-spacing:0; margin-bottom: 2px;}
  .social-card .sc-cta{
    position: absolute; bottom: 18px; right: 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--oxblood);
  }

  /* releases */
  .releases{
    margin-top: 40px;
    border-top: 1px solid var(--hairline);
  }
  .release-row{
    display: grid;
    grid-template-columns: 60px 120px 1fr 140px 120px 100px;
    gap: 16px;
    align-items: center;
    padding: 22px 0;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    transition: background .18s, padding .18s;
  }
  .release-row:hover{ background: rgba(128, 21, 21, .06); padding-left: 12px; padding-right: 12px; }
  .release-row .rr-num{
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--oxblood); letter-spacing: .18em;
  }
  .release-row .rr-cover{
    width: 100px; height: 100px;
    border: 1px solid var(--hairline-strong);
    position: relative; overflow: hidden;
  }
  .release-row .rr-title{
    font-size: 22px; font-weight: 500; letter-spacing: .04em;
    text-transform: uppercase;
  }
  .release-row .rr-title small{
    display:block; margin-top:4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-dim); letter-spacing:.16em;
    text-transform: uppercase;
    font-weight: 400;
  }
  .release-row .rr-meta{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-dim); letter-spacing: .14em;
    text-transform: uppercase;
  }
  .release-row .rr-meta b{ color: var(--ink); display:block; font-weight: 400; margin-bottom:2px; }
  .release-row .rr-play{
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    color: var(--oxblood); font-size: 10px; letter-spacing:.22em;
  }
  .release-row:hover .rr-play{ color: var(--oxblood-bright); }
  .release-row .rr-play .arrow{
    width:0; height:0;
    border-left: 8px solid currentColor;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }

  /* about */
  .about-grid{
    margin-top: 40px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 60px;
    align-items: start;
  }
  .about-grid p{
    font-size: 17px; line-height: 1.6; color: var(--ink);
    margin-bottom: 22px;
    max-width: 58ch;
  }
  .about-grid p::first-letter{ color: var(--oxblood); font-weight: 600; }
  .manifest{
    border: 1px solid var(--hairline-strong);
    padding: 24px 22px;
    position: relative;
  }
  .manifest .m-head{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--oxblood); letter-spacing: .2em;
    text-transform: uppercase; margin-bottom: 18px;
    display:flex; justify-content:space-between;
  }
  .manifest .row{
    display:flex; justify-content:space-between;
    padding: 10px 0; border-bottom: 1px dashed var(--hairline);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase;
  }
  .manifest .row span:first-child{ color: var(--ink-dim); }
  .manifest .row span:last-child{ color: var(--ink); }

  /* projects */
  .projects-stack{
    margin-top: 40px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    border-top: 1px solid var(--hairline);
  }
  .project-row{
    display: grid;
    grid-template-columns: 80px 1fr 180px 120px 180px;
    align-items: center;
    padding: 26px 0;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    position: relative;
    transition: background .18s;
  }
  .project-row:hover{ background: rgba(128, 21, 21, .06); }
  .project-row:hover .pr-title{ color: var(--oxblood-bright); text-shadow: 0 0 14px rgba(183,29,29,.5); }
  .project-row .pr-num{
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--oxblood); letter-spacing: .2em;
  }
  .project-row .pr-title{
    font-size: 34px; font-weight: 500; letter-spacing: -.01em;
    text-transform: uppercase;
    color: var(--ink);
    transition: color .15s, text-shadow .15s;
  }
  .project-row .pr-type, .project-row .pr-year, .project-row .pr-collab{
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--ink-dim); letter-spacing: .14em; text-transform: uppercase;
  }
  .project-row .pr-type b{ color: var(--ink); font-weight: 400; display:block; margin-bottom: 2px;}

  .rule{
    display:grid; grid-template-columns: 40px auto 1fr;
    align-items:center; gap: 12px;
    margin: 28px 0 20px;
  }
  .rule .l, .rule .r{ height:1px; background: var(--hairline); }
  .rule .t{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--oxblood);
  }

  /* ---------- Enrollment ---------- */
  .enroll{
    position: relative;
    margin-top: 22px;
    border: 1px solid var(--hairline-strong);
    padding: 22px 24px 24px;
    display: grid;
    grid-template-columns: 1.1fr 1.4fr;
    gap: 28px;
    align-items: start;
  }
  .enroll::before, .enroll::after{
    content:""; position:absolute; width:10px; height:10px; border:1px solid var(--oxblood);
  }
  .enroll::before{ top:-5px; left:-5px; border-right:none; border-bottom:none; }
  .enroll::after{ bottom:-5px; right:-5px; border-left:none; border-top:none; }
  .enroll .e-head{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px; font-weight: 500;
    letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink);
    line-height: 1.15;
  }
  .enroll .e-head b{ color: var(--oxblood); font-weight: 500;}
  .enroll .e-sub{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-dim); letter-spacing: .18em;
    text-transform: uppercase; margin-top: 10px; line-height: 1.7;
  }
  .enroll form{
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0;
    align-items: stretch;
    border-bottom: 1px solid var(--oxblood);
    margin-top: 6px;
  }
  .enroll input[type=email]{
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; letter-spacing: .12em;
    padding: 14px 4px;
    outline: none;
    width: 100%;
    text-transform: lowercase;
  }
  .enroll input[type=email]::placeholder{
    color: var(--ink-ghost);
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .enroll input[type=email]:focus{
    box-shadow: 0 2px 0 var(--oxblood-bright);
  }
  .enroll .e-submit{
    background: transparent;
    border: 1px solid var(--oxblood);
    color: var(--oxblood);
    padding: 12px 18px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 500;
    cursor: pointer;
    display:inline-flex; align-items:center; gap: 10px;
    transition: background .18s, color .18s, box-shadow .18s;
  }
  .enroll .e-submit:hover{
    color: #fff;
    background: var(--oxblood-bright);
    border-color: var(--oxblood-bright);
    box-shadow: 0 0 16px rgba(183,29,29,.55);
  }
  .enroll .e-terms{
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--ink-ghost); letter-spacing: .18em;
    text-transform: uppercase; margin-top: 12px; line-height: 1.8;
  }
  .enroll .e-terms b{ color: var(--oxblood); }
  .enroll .e-ok{
    color: var(--oxblood-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase;

<script type="text/babel">
/* ================ WIREFRAMES ================ */
const WireSphere = ({ size = 320, stroke = 'var(--oxblood)', lines = 14 }) => {
  const lats = [];
  const r = 150;
  for (let i = 1; i < lines; i++) {
    const t = (i / lines) * Math.PI;
    const ry = Math.sin(t) * r;
    const cy = -Math.cos(t) * r * 0.3;
    lats.push(<ellipse key={'la'+i} cx="0" cy={cy} rx={r} ry={ry*0.35} />);
  }
  const lngs = [];
  for (let i = 0; i < lines; i++) {
    const t = (i / lines) * Math.PI;
    const rx = Math.cos(t) * r;
    lngs.push(<ellipse key={'ln'+i} cx="0" cy="0" rx={Math.abs(rx)} ry={r} />);
  }
  return (
    <svg viewBox="-180 -180 360 360" width={size} height={size} fill="none" stroke={stroke} strokeWidth="0.8">
      <circle cx="0" cy="0" r={r} strokeWidth="1.2" />

};

const WireIcosa = ({ size = 280, stroke = 'var(--oxblood)' }) => {
  const R = 140;
  const pts = [];
  pts.push([0, -R]);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    pts.push([Math.cos(a) * R * 0.9, -R * 0.45]);
  }
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2 + Math.PI / 5;
    pts.push([Math.cos(a) * R * 0.9, R * 0.45]);
  }
  pts.push([0, R]);

  const edges = [];
  for (let i = 1; i <= 5; i++) edges.push([0, i]);
  for (let i = 1; i <= 5; i++) edges.push([i, i === 5 ? 1 : i + 1]);
  for (let i = 0; i < 5; i++) {
    const a = i + 1, b = i + 6, c = ((i + 1) % 5) + 6;
    edges.push([a, b]);
    edges.push([a, c]);
  }
  for (let i = 6; i <= 10; i++) edges.push([i, i === 10 ? 6 : i + 1]);
  for (let i = 6; i <= 10; i++) edges.push([i, 11]);

  return (
    <svg viewBox="-180 -180 360 360" width={size} height={size} fill="none" stroke={stroke} strokeWidth="1">
      {edges.map(([a, b], i) => (
        <line key={i} x1={pts[a][0]} y1={pts[a][1]} x2={pts[b][0]} y2={pts[b][1]} />
      ))}
      {pts.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r="2" fill={stroke} stroke="none" />
      ))}
    </svg>
  );
};

const WireTerrain = ({ size = 260, stroke = 'var(--oxblood)' }) => {
  const cols = 20, rows = 14;
  const cellW = 22, cellH = 14;
  const offX = -(cols * cellW) / 2;
  const offY = 20;
  const shear = 0.55;
  const amp = 52;
  const h = (i, j) => {
    const s = Math.sin(i * 0.9 + j * 1.7) * 43758.5453;
    const n1 = s - Math.floor(s);
    const s2 = Math.sin(i * 0.31 - j * 0.47) * 12543.21;
    const n2 = s2 - Math.floor(s2);
    const cx = cols / 2, cy = rows / 2;
    const d = Math.hypot((i - cx) / cx, (j - cy) / cy);
    const ridge = Math.max(0, 1 - d) * 0.9;
    return (n1 * 0.55 + n2 * 0.45) * 0.45 + ridge * 0.55;
  };
  const project = (i, j) => {
    const px = offX + i * cellW + j * (cellH * shear);
    const py = offY + j * cellH * 0.55 - h(i, j) * amp;
    return [px, py];
  };
  const rowPaths = [];
  for (let j = 0; j < rows; j++) {
    let d = '';
    for (let i = 0; i < cols; i++) {
      const [x, y] = project(i, j);
      d += (i === 0 ? 'M ' : 'L ') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    const t = j / (rows - 1);
    const op = 0.35 + (1 - Math.abs(t - 0.5) * 2) * 0.55;
    rowPaths.push(<path key={'r'+j} d={d} opacity={op.toFixed(2)} />);
  }
  const colPaths = [];
  for (let i = 0; i < cols; i++) {
    let d = '';
    for (let j = 0; j < rows; j++) {
      const [x, y] = project(i, j);
      d += (j === 0 ? 'M ' : 'L ') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    const t = i / (cols - 1);
    const op = 0.3 + (1 - Math.abs(t - 0.5) * 2) * 0.5;
    colPaths.push(<path key={'c'+i} d={d} opacity={op.toFixed(2)} />);
  }
  const peaks = [];
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      if (h(i, j) > 0.82) {
        const [x, y] = project(i, j);
        peaks.push(<circle key={'p'+i+'_'+j} cx={x} cy={y} r="1.6" fill={stroke} stroke="none"/>);
      }
    }
  }
  return (
    <svg viewBox="-160 -120 320 240" width={size} height={size * 0.75} fill="none" stroke={stroke} strokeWidth="0.7">
      <rect x="-150" y="-110" width="300" height="220" stroke={stroke} strokeWidth="0.6" opacity="0.25"/>
      <g stroke={stroke} strokeWidth="0.9">
        <path d="M -150 -100 L -150 -110 L -140 -110"/>
        <path d="M 140 -110 L 150 -110 L 150 -100"/>
        <path d="M -150 100 L -150 110 L -140 110"/>
        <path d="M 140 110 L 150 110 L 150 100"/>
      </g>
      <g>{rowPaths}</g>
      <g>{colPaths}</g>
      {peaks}
      <g stroke={stroke} opacity="0.55">
        <line x1="-150" y1="90" x2="-140" y2="90"/>
        <line x1="-150" y1="50" x2="-140" y2="50"/>
        <line x1="-150" y1="10" x2="-140" y2="10"/>
        <line x1="-150" y1="-30" x2="-140" y2="-30"/>
        <line x1="140" y1="90" x2="150" y2="90"/>
        <line x1="140" y1="50" x2="150" y2="50"/>
      </g>
      <g stroke="none" fill={stroke} fontFamily="monospace" fontSize="7" letterSpacing="2" opacity="0.75">
        <text x="-150" y="-96">Z+</text>
        <text x="132" y="-96">ALT</text>
        <text x="-150" y="106">TERRAIN_04</text>
        <text x="86" y="106">H 0.82</text>
      </g>
    </svg>
  );
};

const Wave909 = ({ size = 160, stroke = 'var(--oxblood)' }) => {
  const W = 320, H = 140;
  const N = 260;
  const cx = 0, cy = 0;
  const samples = [];
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const env = Math.exp(-t * 3.2);
    const click = Math.exp(-t * 90) * 0.8;
    const freq = 22 - t * 16;
    const body = Math.sin(t * freq * Math.PI * 2 - 0.2) * env;
    const sub  = Math.sin(t * (freq * 0.5) * Math.PI * 2) * env * 0.35;
    const y = (body + sub + click) * 0.85;
    samples.push(y);
  }
  const toPath = (flip = 1) => {
    let d = '';
    for (let i = 0; i < N; i++) {
      const x = -W / 2 + (i / (N - 1)) * W;
      const y = cy + samples[i] * (H / 2) * flip;
      d += (i === 0 ? 'M ' : 'L ') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    return d;
  };
  const bars = [];
  const BAR_N = 52;
  for (let i = 0; i < BAR_N; i++) {
    const t = i / (BAR_N - 1);
    const idx = Math.floor(t * (N - 1));
    const amp = Math.abs(samples[idx]);
    const x = -W / 2 + t * W;
    const half = amp * (H / 2) * 0.95;
    const bright = t < 0.08 ? 1 : 0.6;
    bars.push(
      <line key={i} x1={x} y1={-half} x2={x} y2={half}
        stroke={stroke} strokeWidth="1" opacity={bright}/>
    );
  }
  return (
    <svg viewBox={`${-W/2 - 10} ${-H/2 - 22} ${W + 20} ${H + 44}`}
         width={size * 2} height={size}
         fill="none" stroke={stroke} strokeWidth="0.8">
      <g strokeWidth="0.8">
        <path d={`M ${-W/2 - 4} ${-H/2 - 8} L ${-W/2 - 4} ${-H/2 - 14} L ${-W/2 + 6} ${-H/2 - 14}`}/>
        <path d={`M ${W/2 - 6} ${-H/2 - 14} L ${W/2 + 4} ${-H/2 - 14} L ${W/2 + 4} ${-H/2 - 8}`}/>
        <path d={`M ${-W/2 - 4} ${H/2 + 8} L ${-W/2 - 4} ${H/2 + 14} L ${-W/2 + 6} ${H/2 + 14}`}/>
        <path d={`M ${W/2 - 6} ${H/2 + 14} L ${W/2 + 4} ${H/2 + 14} L ${W/2 + 4} ${H/2 + 8}`}/>
      </g>
      <line x1={-W/2} y1="0" x2={W/2} y2="0" strokeDasharray="2 4" opacity="0.35"/>
      <g opacity="0.7">{bars}</g>
      <path d={toPath(1)} strokeWidth="1.1"/>
      <path d={toPath(-1)} strokeWidth="1.1" opacity="0.85"/>
      <g stroke={stroke} strokeWidth="0.9">
        <line x1={-W/2 + 4} y1={-H/2 - 2} x2={-W/2 + 4} y2={H/2 + 2} strokeDasharray="1 3"/>
      </g>
      <g stroke="none" fill={stroke} fontFamily="monospace" fontSize="8" letterSpacing="2" opacity="0.85">
        <text x={-W/2} y={-H/2 - 4}>909 / KICK</text>
        <text x={W/2 - 60} y={-H/2 - 4}>55HZ ↓ 32HZ</text>
        <text x={-W/2} y={H/2 + 12}>TRANSIENT</text>
        <text x={W/2 - 44} y={H/2 + 12}>DECAY 820MS</text>
      </g>
    </svg>
  );
};

/* Hexagon-based geometric mark — used as default release cover icon */
const HexMark = ({ size = 60, stroke = 'var(--oxblood)' }) => {
  const R = 50;
  const hex = (r) => {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    return pts;
  };
  const outer = hex(R);
  const inner = hex(R * 0.55);
  const toPoly = (pts) => pts.map(p => p.join(',')).join(' ');
  return (
    <svg viewBox="-60 -60 120 120" width={size} height={size} fill="none" stroke={stroke} strokeWidth="0.9">
      <polygon points={toPoly(outer)} strokeWidth="1.1"/>
      <polygon points={toPoly(hex(R * 0.78))} opacity="0.55"/>
      <polygon points={toPoly(inner)} strokeWidth="1"/>
      {outer.map((p, i) => (
        <line key={'s'+i} x1="0" y1="0" x2={p[0]} y2={p[1]} opacity="0.45"/>
      ))}
      {outer.map((p, i) => {
        const q = inner[(i + 1) % 6];
        return <line key={'z'+i} x1={p[0]} y1={p[1]} x2={q[0]} y2={q[1]} opacity="0.6"/>;
      })}
      <circle cx="0" cy="0" r="3" fill={stroke} stroke="none"/>
      {outer.map((p, i) => (
        <circle key={'d'+i} cx={p[0]} cy={p[1]} r="1.6" fill={stroke} stroke="none"/>
      ))}
    </svg>
  );
};

/* ================ APP SHELL ================ */
function App(){
  const [view, setView] = useState(() => {
    try { return localStorage.getItem('agoe.view') || 'home'; } catch(e) { return 'home'; }
  });

  useEffect(() => {
    try { localStorage.setItem('agoe.view', view); } catch(e){}
    window.scrollTo({top:0, behavior:'instant'});
  }, [view]);

  const navigate = (next) => {
    if (next === view) return;
    const flash = document.getElementById('flash');
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');
    setTimeout(() => setView(next), 80);
  };

  let View;
  switch(view){
    case 'socials':  View = <SocialsView navigate={navigate} active={view}/>; break;
    case 'content':  View = <ContentView navigate={navigate} active={view}/>; break;
    case 'about':    View = <AboutView navigate={navigate} active={view}/>; break;
    case 'projects': View = <ProjectsView navigate={navigate} active={view}/>; break;
    default:         View = <HomeView navigate={navigate} active={view}/>;
  }

  return <div className="hud">{View}</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
